# SIH26161 — Case Study Configuration
# Case: Kedarnath / Chorabari Lake, Uttarakhand — 17 June 2013
# Sources: Das et al. (2015), Rafiq et al. (2019)

case_name: chorabari
dam_name: "Chorabari moraine dam"
dam_coordinates: [30.745, 79.055]  # [lat, lon]; see data/chorabari/sources.md
dam_type: natural
formation_mechanism: "right-lateral moraine of Chorabari Glacier"
formation_date: "pre-historic, breached 2013-06-17"
blocking_material: "moraine (boulders/gravel/sand/silt)"

# Lake geometry from Das et al. 2015 and related studies
lake_length_m: 250.0        
lake_front_width_m: 150.0   
lake_depth_m: 10.0          # Measured moraine ridge height 
reservoir_volume_m3: 430000.0  # 0.43 million m3 released

river_name: "Mandakini"
downstream_reach_km: 15.0   # Extend past Kedarnath town

# DEM configuration
dem_source: "SRTM GL1 via OpenTopography (downloaded at runtime; no synthetic fallback)"
dem_bbox: [79.00, 30.65, 79.10, 30.80]  # [min_lon, min_lat, max_lon, max_lat]
                                        # Covers Chorabari lake down through Kedarnath valley

# Key downstream exposure points (for Phase 5 validation points)
downstream_points:
  - name: "Kedarnath Town"
    coordinates: [30.735, 79.067]
    distance_km: 1.5
  - name: "Rambara"
    coordinates: [30.695, 79.043]
    distance_km: 7.0

execution:
  nearfield_backend: dualsphysics
  farfield_backend: anuga  # free-tier default; use Delft3D FM only within the one-day time-box
  delft3d_timebox_days: 1
  model_scale_Lr: 40.0
  crs: EPSG:4326
